[build]
  command = "npm ci && npm run build:verified"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    # `connect-src 'none'` is the directive that matters here. This app makes
    # no network requests of its own, so denying them costs nothing — and it
    # means a tampered bundle trying to POST a hexseed to an attacker is
    # blocked by the browser and surfaces as a console violation instead of
    # succeeding silently. The page holds the seed and mnemonic in the DOM;
    # this is the only control that limits where they can go.
    #
    # 'unsafe-inline' is required by the inline QRLLIB bootstrap in index.html.
    # 'unsafe-eval' is required by the indirect eval in src/wallet-worker.js,
    # which evaluates the QRLLIB UMD bundle into the worker's global scope —
    # measured: removing it fails browser-tests/csp.spec.js. It also subsumes
    # 'wasm-unsafe-eval', so that token was redundant and has been dropped.
    # Neither weakens connect-src, which is the directive that matters.
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"

[[redirects]]
  from = "https://offline-wallet-generator.netlify.app/*"
  to = "https://offline-wallet-generator.theqrl.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
