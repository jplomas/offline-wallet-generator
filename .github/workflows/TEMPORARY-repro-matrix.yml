# TEMPORARY — DELETE AFTER THE SECOND RUN (see below).
#
# Purpose: settle a single open question from the 2026-08 security review.
# RELEASE.md told users that byte-for-byte rebuild verification was
# "confirmed on Linux x64 only", because the CSS pipeline uses platform-specific
# native binaries (lightningcss, @tailwindcss/oxide) and nobody had measured
# whether they produce identical output across platforms.
#
# FIRST RUN — 2026-08-03, run 30834055808. Result:
#
#   ubuntu-latest  db322b6e…  2109510 bytes  \ byte-identical
#   macos-latest   db322b6e…  2109510 bytes  /
#   windows-latest be61707d…  2109580 bytes    +70 bytes, first diff at char 16
#
# The cause was NOT the native CSS binaries, which was the original worry —
# Linux and macOS agreeing rules that out. It was git checking out text files
# as CRLF on Windows (`<!DOCTYPE html>\r\n` against `\n`), those carriage
# returns flowing through into the artefact. `.gitattributes` now pins the
# working tree to LF on every platform.
#
# SECOND RUN — the only thing left to do. Dispatch this once more with
# .gitattributes committed. Then:
#
#   - All three match -> drop the Windows caveat from RELEASE.md, delete this
#                        file.
#   - Windows still differs -> record the new delta, keep the caveat, delete
#                        this file anyway and open an issue.
#
# Either way this file goes after that run. It exists to produce evidence
# twice, not to run forever: it triples CI cost for a fact that changes only
# when the toolchain or checkout behaviour does.

name: TEMPORARY cross-platform reproducibility

on:
  push:
    branches: ['cs-phase2']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Build offline artefact
        run: npm run build:offline

      # Also answers a second question: does the documented rebuild procedure
      # work on Windows at all? The postinstall step previously used `cp -r`,
      # which does not exist in cmd.exe.
      - name: Record digest
        shell: bash
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          DIGEST=$(sha256sum dist-offline/index.html | cut -d' ' -f1)
          SIZE=$(wc -c < dist-offline/index.html | tr -d ' ')
          {
            echo "### $OS_LABEL"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| digest | \`$DIGEST\` |"
            echo "| bytes | $SIZE |"
            echo "| node | $(node --version) |"
            echo "| arch | $(node -p 'process.arch') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefact for comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-${{ matrix.os }}
          path: dist-offline/index.html
          retention-days: 7

  compare:
    name: Compare digests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefacts

      - name: Report
        shell: bash
        run: |
          # Written to the log as well as the job summary. The first run put it
          # only in the summary, which meant the digests had to be recovered by
          # downloading the artefacts to find out what happened.
          {
            echo "## Cross-platform reproducibility"
            echo ""
            echo "| platform | sha256 | bytes |"
            echo "|---|---|---|"
            for dir in artefacts/*/; do
              name=$(basename "$dir")
              digest=$(sha256sum "$dir/index.html" | cut -d' ' -f1)
              size=$(wc -c < "$dir/index.html" | tr -d ' ')
              echo "| $name | \`$digest\` | $size |"
            done
            echo ""
          } | tee -a "$GITHUB_STEP_SUMMARY"

          count=$(find artefacts -name index.html -exec sha256sum {} \; | awk '{print $1}' | sort -u | wc -l)
          if [ "$count" -eq 1 ]; then
            echo "**All platforms produced an identical artefact.** Drop the Windows caveat from RELEASE.md, then delete this workflow." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            base=$(find artefacts -name index.html | head -1)
            {
              echo "**Digests differ across platforms ($count distinct).** Keep the caveat in RELEASE.md, note which platforms diverge, then delete this workflow."
              echo ""
              echo "First differing byte offsets:"
              echo '```'
              find artefacts -name index.html | tail -n +2 | while read -r f; do
                echo "$(dirname "$f") vs $(dirname "$base"): $(cmp "$base" "$f" 2>&1 | head -1)"
              done
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # Informational only — this job must not block the branch.
          exit 0
