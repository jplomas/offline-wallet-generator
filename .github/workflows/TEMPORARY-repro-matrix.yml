# TEMPORARY — DELETE AFTER ONE RUN.
#
# Purpose: settle a single open question from the 2026-08 security review.
# RELEASE.md currently tells users that byte-for-byte rebuild verification is
# "confirmed on Linux x64 only", because the CSS pipeline uses platform-specific
# native binaries (lightningcss, @tailwindcss/oxide) and nobody had measured
# whether they produce identical output across platforms.
#
# This workflow builds the offline artefact on ubuntu, macos and windows and
# compares the digests. Read the summary table in the run, then:
#
#   - All three digests match  -> delete the "Linux x64 only" caveat from
#                                 RELEASE.md and this file.
#   - Digests differ           -> keep the caveat, record WHICH platforms
#                                 diverge and by how many bytes, and delete
#                                 this file.
#
# Either way this file goes. It exists to produce evidence once, not to run
# forever: it triples CI cost on every push for a fact that changes only when
# the CSS toolchain does.

name: TEMPORARY cross-platform reproducibility

on:
  push:
    branches: ['cs-phase2']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Build offline artefact
        run: npm run build:offline

      # Also answers a second question: does the documented rebuild procedure
      # work on Windows at all? The postinstall step previously used `cp -r`,
      # which does not exist in cmd.exe.
      - name: Record digest
        shell: bash
        env:
          OS_LABEL: ${{ matrix.os }}
        run: |
          DIGEST=$(sha256sum dist-offline/index.html | cut -d' ' -f1)
          SIZE=$(wc -c < dist-offline/index.html | tr -d ' ')
          {
            echo "### $OS_LABEL"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| digest | \`$DIGEST\` |"
            echo "| bytes | $SIZE |"
            echo "| node | $(node --version) |"
            echo "| arch | $(node -p 'process.arch') |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artefact for comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: offline-${{ matrix.os }}
          path: dist-offline/index.html
          retention-days: 7

  compare:
    name: Compare digests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artefacts

      - name: Report
        shell: bash
        run: |
          {
            echo "## Cross-platform reproducibility"
            echo ""
            echo "| platform | sha256 | bytes |"
            echo "|---|---|---|"
            for dir in artefacts/*/; do
              name=$(basename "$dir")
              digest=$(sha256sum "$dir/index.html" | cut -d' ' -f1)
              size=$(wc -c < "$dir/index.html" | tr -d ' ')
              echo "| $name | \`$digest\` | $size |"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          count=$(find artefacts -name index.html -exec sha256sum {} \; | awk '{print $1}' | sort -u | wc -l)
          if [ "$count" -eq 1 ]; then
            echo "**All platforms produced an identical artefact.** Remove the 'Linux x64 only' caveat from RELEASE.md, then delete this workflow." >> "$GITHUB_STEP_SUMMARY"
          else
            base=$(find artefacts -name index.html | head -1)
            {
              echo "**Digests differ across platforms ($count distinct).** Keep the caveat in RELEASE.md, note which platforms diverge, then delete this workflow."
              echo ""
              echo "First differing byte offsets:"
              echo '```'
              find artefacts -name index.html | tail -n +2 | while read -r f; do
                echo "$(dirname "$f") vs $(dirname "$base"): $(cmp "$base" "$f" 2>&1 | head -1)"
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          # Informational only — this job must not block the branch.
          exit 0
