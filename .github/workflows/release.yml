name: Release offline wallet
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed tag to publish
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify signed annotated tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          git cat-file tag "$TAG" >/dev/null 2>&1 || { echo "::error::$TAG must be an annotated tag"; exit 1; }
          git cat-file tag "$TAG" | grep -qE 'BEGIN (PGP|SSH) SIGNATURE' || { echo "::error::$TAG is not signed"; exit 1; }
      - name: Verify tag version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(node -p "require('./package.json').version")
          [ "${TAG#v}" = "$VERSION" ] || { echo "::error::$TAG does not match package version $VERSION"; exit 1; }
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:offline
      - run: npm run check:offline
      - name: Name and hash artefact
        id: artefact
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="qrl-offline-wallet-${VERSION}.html"
          mv dist-offline/index.html "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.artefact.outputs.name }}
            ${{ steps.artefact.outputs.name }}.sha256
          fail_on_unmatched_files: true
