<!DOCTYPE html>
<html lang="en" data-theme="qrl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QRL Offline Wallet Generator</title>
    <script>
      window.qrllibReady = new Promise((resolve) => {
        let qrllib;
        Object.defineProperty(window, 'QRLLIB', {
          configurable: true,
          get() { return qrllib; },
          set(value) {
            qrllib = value;
            if (typeof value?.str2bin === 'function') resolve(value);
          }
        });
      });
    </script>
    <script src="./qrllib.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
